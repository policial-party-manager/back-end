spring:
  application:
    name: policial-party-manager
  datasource:
    url: jdbc:mysql://localhost:3306/party_manager?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

  # Redis（验证码存储 + refresh token 白名单）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # 邮件（验证码发送）。
  # 未配置 host 时不会创建 JavaMailSender，验证码将降级打印到日志（便于本地开发/联调）。
  # 配置示例（QQ 邮箱）：
  #   host: smtp.qq.com
  #   port: 465
  #   username: your-account@qq.com
  #   password: 你的 SMTP 授权码（不是登录密码）
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  profiles:
    include: secret

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: party-building-platform-secret-key-2026-very-long-secret
  # 访问令牌有效期：2 小时（毫秒）
  access-token-expiration: 7200000
  # 刷新令牌有效期：7 天（毫秒）
  refresh-token-expiration: 604800000

server:
  port: 8080
